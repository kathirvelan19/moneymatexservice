server.port=${PORT:8080}
server.address=0.0.0.0

spring.application.name=moneytrace-backend

# H2 Database Config
spring.datasource.url=jdbc:h2:mem:moneytracedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Gemini API Key configuration (supports GEMINI_API_KEY, VITE_GEMINI_API_KEY, and GEMINI_KEY)
gemini.api.key=${GEMINI_API_KEY:${VITE_GEMINI_API_KEY:${GEMINI_KEY:}}}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}

